# Runs the tests, then publishes web/ to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.js
      # The house key (data repo + token sealed with the house password) lives
      # in a repo secret, never in git; the site asks for the password on first visit.
      - name: Add the house key
        env:
          HOUSE_KEY_JSON: ${{ secrets.HOUSE_KEY_JSON }}
        run: if [ -n "$HOUSE_KEY_JSON" ]; then printf '%s\n' "$HOUSE_KEY_JSON" > web/house-key.json; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
